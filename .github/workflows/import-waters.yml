name: Import waters from OpenStreetMap

# Regenerates public/waters.json (Brandenburg plus the Polish voivodeships Zachodniopomorskie and
# Lubuskie: lakes >= 5 ha, rivers and canals in ~10 km sections) via the Overpass API and commits the result to the branch it ran on.
# Run manually from the Actions tab, or push to a branch named waters-*.
on:
  workflow_dispatch:
  push:
    branches: ['waters-*']
    paths: ['scripts/import-waters.mjs', '.github/workflows/import-waters.yml']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query Overpass and build waters.json
        run: |
          node scripts/import-waters.mjs
          node -e "const w=require('./public/waters.json'); if (w.generated !== new Date().toISOString().slice(0,10)) { console.error('waters.json was not regenerated'); process.exit(1); }"
      - name: Summary
        run: |
          node -e "const w=require('./public/waters.json'); const c={}; for (const x of w.waters) { const k=(x.cc||'DE')+' '+x.type; c[k]=(c[k]||0)+1; } console.log(w.waters.length,'waters',JSON.stringify(c),'regions:',w.regions.length)"
          ls -la public/waters.json
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/waters.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update waters.json from OpenStreetMap"
          git push
